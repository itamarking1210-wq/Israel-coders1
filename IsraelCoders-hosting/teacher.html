<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Israel Coders — לוח המורה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="teacher.css" />
</head>
<body class="teacher-page">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" width="30" height="26" viewBox="0 0 30 26" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 5 13 15 23"/><polyline points="26 3 16 13 26 23"/></svg>
      <span>Israel Coders</span>
      <span class="t-badge">לוח המורה</span>
    </div>
    <div class="top-actions">
      <a class="btn ghost small" href="/">לאפליקציה</a>
      <div class="user">
        <span id="userName"></span>
        <span id="userInitial" class="avatar"></span>
      </div>
      <button id="logoutBtn" class="icon-btn" title="יציאה"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </header>

  <main class="t-layout">
    <aside class="sidebar t-side">
      <h2>הכיתות שלי</h2>
      <ul id="classList" class="t-classes"></ul>
      <form id="newClassForm" class="t-new">
        <label class="field">כיתה חדשה
          <input id="newClassName" maxlength="40" placeholder="למשל: ז'3 — פייתון" />
        </label>
        <button class="btn check" type="submit">יצירת כיתה</button>
      </form>
      <p id="sideMsg" class="t-msg" role="status"></p>
    </aside>

    <section class="t-main">
      <div id="emptyState" class="t-empty t-card" hidden>
        <img src="images/owl.png" alt="" />
        <h1>ברוכים הבאים ללוח המורה</h1>
        <p>צרו כיתה ראשונה בצד. כל כיתה מקבלת קוד הצטרפות קצר — התלמידים מקלידים אותו באפליקציה, ומיד תוכלו לראות את ההתקדמות שלהם.</p>
      </div>

      <div id="classView" hidden>
        <div class="t-card t-head">
          <div>
            <h1 id="classTitle"></h1>
            <p class="t-sub">התלמידים מצטרפים כך: באפליקציה לוחצים על סמל הכיתה (למעלה) ומקלידים את הקוד.</p>
          </div>
          <div class="t-code">
            <span>קוד הצטרפות</span>
            <strong id="joinCode" dir="ltr"></strong>
            <div class="t-code-actions">
              <button id="copyCode" class="btn ghost small" type="button">העתקה</button>
              <button id="newCodeBtn" class="btn ghost small" type="button">קוד חדש</button>
            </div>
          </div>
        </div>

        <div id="stats" class="t-stats"></div>

        <div class="t-toolbar">
          <div class="tabs t-tabs">
            <button class="tab active" data-view="students" type="button">תלמידים</button>
            <button class="tab" data-view="map" type="button">מפת משימות</button>
          </div>
          <button id="refreshBtn" class="btn ghost small" type="button">רענון</button>
        </div>

        <div class="t-card">
          <div id="studentsView"></div>
          <div id="mapView" hidden></div>
        </div>

        <button id="deleteClass" class="btn ghost small t-danger" type="button">מחיקת הכיתה</button>
      </div>
    </section>
  </main>

  <dialog id="studentDialog" class="t-dialog">
    <div class="t-dialog-body">
      <div class="t-dialog-head">
        <div>
          <h2 id="sdName"></h2>
          <p id="sdSummary" class="t-sub"></p>
        </div>
        <button id="sdClose" class="icon-btn" title="סגירה" type="button">&times;</button>
      </div>
      <div id="sdMissions" class="t-missions"></div>
      <div id="sdCodeBox" class="t-code-view" hidden>
        <div class="t-code-title" id="sdCodeTitle"></div>
        <pre id="sdCode" dir="ltr"></pre>
      </div>
      <button id="sdRemove" class="btn ghost small t-danger" type="button">הוצאה מהכיתה</button>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="exercises.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
